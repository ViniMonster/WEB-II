openapi: 3.0.3
info:
  title: API REST - Pizzaria
  version: "1.0"
  description: >
    Web Service REST de uma pizzaria: clientes e pedidos (um cliente tem vários
    pedidos), incluindo cancelamento de pedido (por exemplo, pizza veio errada).
servers:
  - url: http://localhost:8080
    description: Servidor local
tags:
  - name: Clientes
    description: Cadastro, consulta, alteração e exclusão de clientes
  - name: Pedidos
    description: Criação, consulta, alteração, cancelamento e exclusão de pedidos
paths:
  /clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      description: "Retorna todos os clientes cadastrados."
      responses:
        "200":
          description: Lista de clientes (pode ser vazia)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cliente"
    post:
      tags: [Clientes]
      summary: Cadastrar cliente
      description: "Cria um novo cliente. O id é gerado automaticamente (qualquer id enviado é ignorado)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cliente"
            example:
              nome: Joao Silva
              telefone: "(47) 99999-9999"
              endereco: Rua A, 123 - Blumenau
      responses:
        "201":
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "400":
          description: "Dados inválidos (nome vazio ou com menos de 3 caracteres, telefone inválido, endereço vazio, JSON malformado)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
  /clientes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id do cliente
        schema:
          type: integer
          format: int64
    get:
      tags: [Clientes]
      summary: Buscar cliente por id
      responses:
        "200":
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "404":
          description: Cliente não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
    put:
      tags: [Clientes]
      summary: Alterar cliente
      description: "Substitui nome, telefone e endereço de um cliente existente."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cliente"
            example:
              nome: Joao S. Silva
              telefone: "(47) 98888-8888"
              endereco: Rua B, 456 - Blumenau
      responses:
        "200":
          description: Cliente alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
        "404":
          description: Cliente não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
    delete:
      tags: [Clientes]
      summary: Excluir cliente
      description: "Remove um cliente. Não é possível excluir um cliente que já tenha pedidos."
      responses:
        "204":
          description: Cliente excluído (sem corpo na resposta)
        "404":
          description: Cliente não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
        "409":
          description: Cliente possui pedidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
  /clientes/{id}/pedidos:
    get:
      tags: [Clientes]
      summary: Listar pedidos de um cliente
      description: "Retorna todos os pedidos de um cliente (relação 1:N entre Cliente e Pedido)."
      parameters:
        - name: id
          in: path
          required: true
          description: Id do cliente
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Lista de pedidos do cliente (pode ser vazia)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pedido"
        "404":
          description: Cliente não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
  /pedidos:
    get:
      tags: [Pedidos]
      summary: Listar pedidos
      description: "Retorna todos os pedidos (criados e cancelados)."
      responses:
        "200":
          description: Lista de pedidos (pode ser vazia)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pedido"
    post:
      tags: [Pedidos]
      summary: Criar pedido
      description: "Cria um pedido para um cliente existente. O status inicial é CRIADO."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoRequest"
            example:
              clienteId: 1
              itens: 2x Pizza Calabresa, 1x Refrigerante
              valorTotal: 89.90
      responses:
        "201":
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "400":
          description: "Dados inválidos (cliente ausente, itens vazios, valor menor ou igual a zero)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
        "404":
          description: Cliente informado não existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
  /pedidos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id do pedido
        schema:
          type: integer
          format: int64
    get:
      tags: [Pedidos]
      summary: Buscar pedido por id
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "404":
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
    put:
      tags: [Pedidos]
      summary: Alterar pedido
      description: "Altera os itens e o valor total de um pedido que ainda não foi cancelado."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoAlteracaoRequest"
            example:
              itens: 3x Pizza Calabresa
              valorTotal: 120.00
      responses:
        "200":
          description: Pedido alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
        "404":
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
        "409":
          description: Pedido cancelado não pode ser alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
    delete:
      tags: [Pedidos]
      summary: Excluir pedido
      description: "Remove definitivamente um pedido."
      responses:
        "204":
          description: Pedido excluído (sem corpo na resposta)
        "404":
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
  /pedidos/{id}/cancelar:
    patch:
      tags: [Pedidos]
      summary: Cancelar pedido
      description: "Cancela um pedido (por exemplo, pizza veio errada) registrando o motivo. Muda o status para CANCELADO."
      parameters:
        - name: id
          in: path
          required: true
          description: Id do pedido
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelamentoRequest"
            example:
              motivo: Pizza veio errada
      responses:
        "200":
          description: Pedido cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "400":
          description: Motivo ausente ou em branco
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
        "404":
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
        "409":
          description: Pedido já estava cancelado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResposta"
components:
  schemas:
    Cliente:
      type: object
      required: [nome, telefone, endereco]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        nome:
          type: string
          minLength: 3
          example: Joao Silva
        telefone:
          type: string
          description: "Números, parênteses, hífen e espaço (8 a 20 caracteres)"
          example: "(47) 99999-9999"
        endereco:
          type: string
          example: Rua A, 123 - Blumenau
    Pedido:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        cliente:
          $ref: "#/components/schemas/Cliente"
        itens:
          type: string
          example: 2x Pizza Calabresa, 1x Refrigerante
        valorTotal:
          type: number
          format: double
          example: 89.90
        status:
          type: string
          enum: [CRIADO, CANCELADO]
          example: CRIADO
        motivoCancelamento:
          type: string
          nullable: true
          example: null
    PedidoRequest:
      type: object
      required: [clienteId, itens, valorTotal]
      properties:
        clienteId:
          type: integer
          format: int64
          example: 1
        itens:
          type: string
          example: 2x Pizza Calabresa, 1x Refrigerante
        valorTotal:
          type: number
          format: double
          description: Maior que zero
          example: 89.90
    PedidoAlteracaoRequest:
      type: object
      required: [itens, valorTotal]
      properties:
        itens:
          type: string
          example: 3x Pizza Calabresa
        valorTotal:
          type: number
          format: double
          description: Maior que zero
          example: 120.00
    CancelamentoRequest:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          example: Pizza veio errada
    ErroResposta:
      type: object
      properties:
        status:
          type: integer
          example: 404
        mensagem:
          type: string
          example: Cliente 99 não encontrado.
        timestamp:
          type: string
          format: date-time
